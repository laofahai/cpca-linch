name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest setuptools
          pip install -e .

      - name: Run tests
        run: pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Verify wheel installation outside source tree
        run: |
          python -m venv /tmp/cpca-smoke
          /tmp/cpca-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/cpca-smoke/bin/python -c "import cpca; r = cpca.transform(['中山市南朗镇人民路1号']).iloc[0]; assert r['识别状态'] == '历史名称'; assert r['现行名称建议'] == '南朗街道'"
